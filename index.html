<style>
/* Layout: HUD over a pannable night-shift isometric office; roster strip below; collectible card that spins in and projects pixel by pixel */
:root{
  --night:#120f1c; --panel:#1c1730; --line:#352c52; --ink:#f4efe6; --mute:#a9a0c6;
  --amber:#ff8f3a; --amber-2:#ff6a2a; --teal:#2ec4a8; --teal-2:#1a8f7f; --sel:#ffd84a; --outline:#1b1428; --holo:#bff7ec;
  --f-display:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-label:"Silkscreen", ui-monospace, "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cut:"Anton", Impact, "Arial Narrow", sans-serif; --f-comic:"Bangers", Impact, sans-serif; --red:#e3242b; --ink0:#0d0c11;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#0b0912;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
/* full-screen game: the office fills the phone; HUD panels float on top (cut-paper style: black slabs, white rim, red offset shadow) */
.stage{position:fixed;inset:0;background:#0b0912;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;image-rendering:pixelated}
.stage canvas.drag{cursor:grabbing}
.hud{position:fixed;left:0;right:0;z-index:10;pointer-events:none;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.hud button,.hud .grab{pointer-events:auto}
.hud-top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:22px;background:linear-gradient(180deg,rgba(13,12,17,.78),rgba(13,12,17,0));display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hud-bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:34px;background:linear-gradient(0deg,rgba(13,12,17,.92) 55%,rgba(13,12,17,0));display:flex;flex-direction:column;gap:14px}
/* jagged slab button */
/* arcade pixel keys: stepped corners, own colour each, idle bob + pixel shine, sinks when pressed */
.pbtn{--c:#ffd84a;--cl:#fff3b0;--cd:#c98f12;--ink:#1b1428;--px:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px));
  position:relative;isolation:isolate;border:0;background:none;padding:0 0 6px;cursor:pointer;color:var(--ink);animation:pbob 2.8s steps(4) infinite;animation-delay:var(--dl,0s)}
.pbtn::before{content:"";position:absolute;left:4px;right:-4px;top:6px;bottom:0;background:#000;clip-path:var(--px);z-index:-1;transition:transform .07s steps(2)}
.pbtn .face{position:relative;display:block;background:var(--ink);clip-path:var(--px);padding:3px;transition:transform .07s steps(2)}
.pbtn .face>span{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--c);color:var(--ink);clip-path:var(--px);
  padding:9px 15px 12px;box-shadow:inset 0 -5px 0 var(--cd),inset 0 3px 0 var(--cl);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;line-height:1;white-space:nowrap}
.pbtn .face>span::after{content:"";position:absolute;top:0;bottom:0;left:0;width:8px;background:rgba(255,255,255,.65);box-shadow:12px 0 0 rgba(255,255,255,.35);transform:translateX(-30px) skewX(-18deg);
  animation:pshine 4.5s steps(14) infinite;animation-delay:var(--dl,0s)}
.pbtn:active{animation-play-state:paused}
.pbtn:active .face{transform:translateY(4px)}
.pbtn:active::before{transform:translateY(-2px) scaleY(.7)}
.pbtn[aria-pressed="false"] .face>span{filter:saturate(.45) brightness(.72)}
.pbtn[aria-pressed="true"],.pbtn[aria-current="page"]{animation:pjump 1.1s steps(3) infinite}
.pbtn[aria-pressed="true"] .face,.pbtn[aria-current="page"] .face{background:#fff}
.pbtn[aria-pressed="true"] .face>span::after,.pbtn[aria-current="page"] .face>span::after{animation-duration:2.2s}
.pbtn:not([aria-current="page"])[data-v] .face>span{filter:saturate(.45) brightness(.72)}
.pbtn b{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink);background:rgba(255,255,255,.55);padding:1px 4px}
@keyframes pbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes pjump{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}70%{transform:translateY(-1px)}}
@keyframes pshine{0%{transform:translateX(-30px) skewX(-18deg)}30%,100%{transform:translateX(260px) skewX(-18deg)}}

#fSkill{--c:#ff8f5a;--cl:#ffc9a8;--cd:#c9502a;--dl:-1.1s}

#zOut{--c:#a8e05a;--cl:#d9f5a8;--cd:#6c9e2a;--dl:-2.1s}
#prev{--c:#5ab8ff;--cl:#b7e0ff;--cd:#2a76c4;--dl:-.4s}

#next{--c:#ff7fb0;--cl:#ffc4da;--cd:#c44a7c;--dl:-2s}
@media (prefers-reduced-motion:reduce){.pbtn,.pbtn .face>span::after{animation:none!important}}

.logo{width:44px;height:44px;flex:none;image-rendering:pixelated;border:3px solid #fff;background:#25242f;transform:rotate(3deg)}
.titles{display:flex;flex-direction:column;gap:5px;min-width:0}
h1{margin:0;font-size:19px;line-height:1;white-space:nowrap}
.rn{display:inline-block;transform:rotate(var(--rr,0deg));padding:1px .09em 0;margin-right:1px;font-family:var(--f-cut);font-weight:400;background:#fff;color:var(--ink0)}
.rn.inv{background:var(--ink0);color:#fff;outline:2px solid #fff;outline-offset:-1px}
.rn.red{background:var(--red);color:#fff;font-family:var(--f-comic);font-size:1.12em}

.sync{font-family:var(--f-label);font-size:9px;letter-spacing:.06em;color:#d8d3e8;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.sync span{overflow:hidden;text-overflow:ellipsis}
#syncTxt::after{content:' · ' attr(data-v)}
.sync::before{content:"";width:6px;height:6px;flex:none;background:var(--teal);box-shadow:0 0 6px var(--teal)}
/* starburst counter */
.burst{flex:none;width:82px;height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);position:relative;color:var(--ink0)}
.burst::before,.burst::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,61% 22%,85% 9%,79% 34%,100% 42%,81% 57%,94% 80%,68% 77%,59% 100%,45% 80%,22% 94%,24% 69%,0 60%,19% 44%,6% 20%,32% 23%);}
.burst::before{background:var(--red);transform:translate(4px,4px)}
.burst::after{background:var(--sel);inset:4px;outline:0}
.burst b,.burst span{position:relative;z-index:1}
.burst b{font-family:var(--f-comic);font-size:30px;line-height:.9;font-weight:400}
.burst span{font-family:var(--f-cut);font-size:9px;letter-spacing:.06em;text-transform:uppercase}
body[data-view="team"] .zoom{display:none}
.filters{display:flex;gap:12px;flex-wrap:wrap}
.filters .pbtn .face>span{padding:7px 11px 10px;font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tabs .pbtn .face>span{padding:13px 10px 16px;font-size:19px}
.tabs .pbtn svg{width:22px;height:22px}
.zoom{position:fixed;z-index:10;right:max(14px,env(safe-area-inset-right,0px));top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:14px}
.zoom .pbtn .face>span{width:46px;height:46px;padding:0 0 3px;font-size:24px}
.toast{position:fixed;z-index:10;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);translate:-50% 0;rotate:-2deg;max-width:calc(100% - 40px);
  background:var(--ink0);color:#fff;border:3px solid #fff;box-shadow:5px 5px 0 var(--red);font-family:var(--f-cut);font-size:14px;letter-spacing:.05em;text-transform:uppercase;
  padding:8px 14px;pointer-events:none;transition:opacity .35s,translate .35s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.off{opacity:0;translate:-50% -10px}
.tip{position:absolute;pointer-events:none;transform:translate(-50%,-100%) rotate(-2deg);background:var(--ink0);color:#fff;border:2px solid #fff;box-shadow:3px 3px 0 var(--red);
  font-family:var(--f-cut);font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;white-space:nowrap}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:rgba(11,9,18,.85)}
.stage-msg div{max-width:32ch;display:flex;flex-direction:column;gap:10px;background:var(--ink0);border:3px solid #fff;box-shadow:6px 6px 0 var(--red);padding:18px;transform:rotate(-1.5deg)}

/* team screen */
#viewTeam{position:fixed;inset:0;z-index:8;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:repeating-linear-gradient(-30deg,rgba(227,36,43,.10) 0 18px,transparent 18px 46px),#0d0c11;
  padding-top:calc(env(safe-area-inset-top,0px) + 118px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 170px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.team-title{margin:0 0 18px;font-size:30px;line-height:1}

.mate{--r:-1.5deg;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0;padding:12px 8px 12px;cursor:pointer;color:#fff;
  background:var(--ink0);border:3px solid #fff;box-shadow:5px 5px 0 var(--red);transform:rotate(var(--r));transition:transform .12s cubic-bezier(.3,1.6,.5,1)}

.mate .rl{font-size:12px;line-height:1.25;color:#cfc9e0}
/* speech bubbles */
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}

  font-family:var(--f-display);font-weight:700;font-size:12px;line-height:1.1;white-space:nowrap;will-change:transform;animation:bubIn .2s steps(3) both}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:7px;margin-left:-5px;background:#1b1428;clip-path:polygon(0 0,100% 0,50% 100%)}

.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0d0c11;

  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

HATS.forEach(h => {

/* ---------- creature sprite ---------- */
function R(ctx, x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x|0, y|0, w, h); }
function drawCreature(ctx, x, y, o){
  const [m, l, s] = o.pal; x = Math.round(x); y = Math.round(y);
  const st = o.step || 0;
  R(ctx, x+1, y+10, 5, 4 - (st===1?1:0), OUT); R(ctx, x+8, y+10, 5, 4 - (st===2?1:0), OUT);
  R(ctx, x+2, y+11, 3, 2 - (st===1?1:0), s); R(ctx, x+9, y+11, 3, 2 - (st===2?1:0), s);
  const lay = o.waveL ? y+1 : y+5 + (o.typeL || 0), ray = o.wave ? y+1 : y+5 + (o.typeR || 0);
  R(ctx, x-3, lay-1, 4, o.waveL?6:5, OUT); R(ctx, x-2, lay, 2, o.waveL?4:3, m);
  R(ctx, x+13, ray-1, 4, o.wave?6:5, OUT); R(ctx, x+14, ray, 2, o.wave?4:3, m);
  R(ctx, x+1, y-1, 12, 1, OUT); R(ctx, x-1, y+1, 1, 9, OUT); R(ctx, x+14, y+1, 1, 9, OUT); R(ctx, x+1, y+11, 12, 1, OUT);
  R(ctx, x, y, 1, 1, OUT); R(ctx, x+13, y, 1, 1, OUT); R(ctx, x, y+10, 1, 1, OUT); R(ctx, x+13, y+10, 1, 1, OUT);
  R(ctx, x+1, y, 12, 11, m); R(ctx, x, y+1, 14, 9, m);
  R(ctx, x+13, y+2, 1, 8, s); R(ctx, x+1, y+10, 12, 1, s); R(ctx, x+12, y+9, 1, 1, s);
  R(ctx, x+2, y+1, 4, 1, l); R(ctx, x+1, y+2, 1, 3, l);
  const lk = o.look || 0, ey = y + 4;
  if (o.wink) { R(ctx, x+3+lk, ey+1, 3, 1, OUT); R(ctx, x+3+lk, ey, 1, 1, OUT); R(ctx, x+9+lk, ey, 2, 2, OUT); R(ctx, x+9+lk, ey, 1, 1, '#ffffff'); }
  else if (o.blink) { R(ctx, x+4+lk, ey+1, 2, 1, OUT); R(ctx, x+9+lk, ey+1, 2, 1, OUT); }
  else { R(ctx, x+4+lk, ey, 2, 2, OUT); R(ctx, x+9+lk, ey, 2, 2, OUT); R(ctx, x+4+lk, ey, 1, 1, '#ffffff'); R(ctx, x+9+lk, ey, 1, 1, '#ffffff'); }
  const ga = ctx.globalAlpha; ctx.globalAlpha = ga * .55; R(ctx, x+2, y+7, 2, 1, '#ff4f7a'); R(ctx, x+11, y+7, 2, 1, '#ff4f7a'); ctx.globalAlpha = ga;

  const h = HATS[o.hat % HATS.length], hy = y + h.off - (o.hatLift || 0);

  h.px.forEach(([px, py, c]) => R(ctx, x+px, hy+py, 1, 1, c));

function drawCreatureBack(ctx, x, y, o){
  const [m, l, s] = o.pal; x = Math.round(x); y = Math.round(y);
  const ly = y + 3 + (o.typeL || 0), ry = y + 3 + (o.typeR || 0);
  R(ctx, x-3, ly-1, 4, 5, OUT); R(ctx, x-2, ly, 2, 3, m); R(ctx, x+13, ry-1, 4, 5, OUT); R(ctx, x+14, ry, 2, 3, m);
  R(ctx, x+1, y-1, 12, 1, OUT); R(ctx, x-1, y+1, 1, 9, OUT); R(ctx, x+14, y+1, 1, 9, OUT); R(ctx, x+1, y+11, 12, 1, OUT);
  R(ctx, x, y, 1, 1, OUT); R(ctx, x+13, y, 1, 1, OUT); R(ctx, x, y+10, 1, 1, OUT); R(ctx, x+13, y+10, 1, 1, OUT);
  R(ctx, x+1, y, 12, 11, m); R(ctx, x, y+1, 14, 9, m);
  R(ctx, x+1, y+7, 12, 4, s); R(ctx, x, y+7, 14, 3, s);
  R(ctx, x+3, y+1, 8, 1, l); R(ctx, x+6, y+4, 2, 2, s);

// cached sprite frames: body top-left sits at (5,10) inside a 24x30 canvas
const sprCache = new Map();
function creatureSprite(a, blink, look, step, wave, typeL, typeR){
  typeL = typeL || 0; typeR = typeR || 0;
  const key = a.hat + '|' + a.pal[0] + '|' + (blink ? 1 : 0) + '|' + look + '|' + step + '|' + (wave ? 1 : 0) + '|' + typeL + typeR;

/* ---------- app logo: the crew mascot at its desk ---------- */
const LOGO_PAL = BODIES[0], LOGO_HAT = 7;
function drawLogo(g, t, o){
  o = o || {};

  R(g, 15, 17, 2, 2, '#ffd84a');
  R(g, 7, 20, 18, 1, '#3a3a48');
  R(g, 7, 17 + ty, 4, 3, OUT); R(g, 8, 17 + ty, 2, 2, LOGO_PAL[0]);
  R(g, 21, 18 - ty, 4, 3, OUT); R(g, 22, 18 - ty, 2, 2, LOGO_PAL[0]);
  R(g, 25, 15, 5, 6, OUT); R(g, 26, 16, 3, 4, '#ffffff'); R(g, 26, 16, 3, 1, '#5b3e2e'); R(g, 29, 17, 2, 2, OUT);
  for (let i = 0; i < 3; i++) { const ph = (t * 1.4 + i / 3) % 1, sy = Math.round(14 - ph * 7), sx = 26 + (i % 2) + Math.round(Math.sin(t * 3 + i * 2)); const ga = g.globalAlpha; g.globalAlpha = (1 - ph) * .85; R(g, sx, sy, 1, 2, '#e8e6ef'); g.globalAlpha = ga; }
  if (Math.sin(t * 3) > .3) R(g, 12, 16, 1, 1, '#7dffe7');

const logoCtx = $('logo').getContext('2d'), backCtx = $('backLogo').getContext('2d');


/* ---------- iso helpers ---------- */
const TW = 16, TH = 8, WH = 72, M = 14;
let C = 14, RR = 0, OX = 0, OY = 0, WW = 0, WHt = 0;
function iso(x, y, z){ return [OX + (x - y) * TW, OY + (x + y) * TH - (z || 0)]; }
function poly(ctx, pts, c){ ctx.fillStyle = c; ctx.beginPath(); pts.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); }
function box(ctx, x, y, w, d, h, z, top, left, right){
  z = z || 0;
  poly(ctx, [iso(x,y+d,z), iso(x+w,y+d,z), iso(x+w,y+d,z+h), iso(x,y+d,z+h)], left);
  poly(ctx, [iso(x+w,y,z), iso(x+w,y+d,z), iso(x+w,y+d,z+h), iso(x+w,y,z+h)], right);
  poly(ctx, [iso(x,y,z+h), iso(x+w,y,z+h), iso(x+w,y+d,z+h), iso(x,y+d,z+h)], top);
}
function wallB(ctx, x, z, w, h, c){ poly(ctx, [iso(x,0,z), iso(x+w,0,z), iso(x+w,0,z+h), iso(x,0,z+h)], c); }
function wallL(ctx, y, z, w, h, c){ poly(ctx, [iso(0,y,z), iso(0,y+w,z), iso(0,y+w,z+h), iso(0,y,z+h)], c); }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// bake a world-space drawing into its own small canvas
function bake(x, y, w, d, zmax, fn){
  const pts = [iso(x,y,zmax), iso(x+w,y,zmax), iso(x,y+d,zmax), iso(x+w,y+d,0), iso(x,y+d,0), iso(x+w,y,0)];

async function loadCrew(){
  try {
    const r = await fetch('crew.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error(r.status);
    const d = await r.json(); setCrew((d.crew || []).map(c => Object.assign({}, c)));
    if (d.lastSync) $('syncTxt').textContent = fmtSync(d.lastSync);
  } catch (e) {
    if (!crew.length) showMsg('No pude cargar a tu equipo', 'Revisa tu conexión a internet y vuelve a abrir la app.');
  }
}
loadCrew();
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCrew(); });
const APP_VERSION = 'v11';
$('syncTxt').dataset.v = APP_VERSION;
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
}
})();
</script>
